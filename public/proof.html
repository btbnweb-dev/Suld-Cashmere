<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SULD — frame scrub proof</title>
<style>
  html,body{margin:0;background:#1a1715;color:#f6f2ea;font-family:ui-monospace,monospace}
  #story{position:relative}
  #stage{position:relative;height:100svh;width:100%;overflow:hidden;background:#1a1715}
  #sequence{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{position:absolute;top:24px;left:24px;z-index:10;
       font-size:22px;letter-spacing:.14em;
       background:rgba(0,0,0,.55);padding:12px 18px}
  #hud small{display:block;font-size:12px;opacity:.65;letter-spacing:.1em;margin-top:6px}
  .after{height:120vh;display:grid;place-items:center;background:#f6f2ea;color:#1a1715}
</style>
</head>
<body>

<div id="story">
  <div id="stage">
    <canvas id="sequence"></canvas>
    <div id="hud">FRAME 01 / 40<small>progress 0.000 · scrollY 0</small></div>
  </div>
</div>

<div class="after">pin released — scroll back up</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger)

const FRAME_COUNT = 40
const canvas = document.getElementById('sequence')
const ctx = canvas.getContext('2d')
const hud = document.getElementById('hud')

const images = new Array(FRAME_COUNT).fill(null)
let loaded = 0
let current = -1

const url = i => '/sequence/frame-' + String(i + 1).padStart(4, '0') + '.webp'

/** object-fit: cover, done arithmetically so frames are never stretched. */
function drawCover(img) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2)
  const w = canvas.clientWidth
  const h = canvas.clientHeight
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr)
    canvas.height = Math.round(h * dpr)
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  const s = Math.max(w / img.naturalWidth, h / img.naturalHeight)
  const dw = img.naturalWidth * s
  const dh = img.naturalHeight * s
  ctx.clearRect(0, 0, w, h)
  ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh)
}

/** Draw frame `i`, falling back to the nearest decoded neighbour if it is not ready. */
function drawFrame(i) {
  let idx = Math.min(FRAME_COUNT - 1, Math.max(0, i))
  let img = images[idx]
  if (!img) {
    for (let d = 1; d < FRAME_COUNT && !img; d++) {
      img = images[idx - d] || images[idx + d] || null
    }
  }
  if (!img) return
  drawCover(img)
  current = idx
}

function setHud(frame, progress) {
  hud.innerHTML = 'FRAME ' + String(frame + 1).padStart(2, '0') + ' / ' + FRAME_COUNT
    + '<small>progress ' + progress.toFixed(3)
    + ' · scrollY ' + Math.round(window.scrollY)
    + ' · loaded ' + loaded + '/' + FRAME_COUNT + '</small>'
}

// ---- load every frame, then build the trigger -------------------------------
// The proof does not need staged loading; correctness first.
let settled = 0
for (let i = 0; i < FRAME_COUNT; i++) {
  const img = new Image()
  img.onload = img.onerror = () => {
    if (img.naturalWidth) { images[i] = img; loaded++ }
    if (++settled === FRAME_COUNT) start()
  }
  img.src = url(i)
}

function start() {
  drawFrame(0)
  setHud(0, 0)

  // Frame index is derived DIRECTLY from ScrollTrigger progress — no tween in between,
  // which is the one link that proved unreliable in the React build.
  ScrollTrigger.create({
    trigger: '#story',
    start: 'top top',
    end: '+=500%',
    scrub: true,
    pin: '#stage',
    pinSpacing: true,
    anticipatePin: 1,
    invalidateOnRefresh: true,
    onUpdate: self => {
      const frame = Math.round(self.progress * (FRAME_COUNT - 1))
      if (frame !== current) drawFrame(frame)
      setHud(frame, self.progress)
    },
  })

  window.addEventListener('resize', () => { if (current >= 0) drawFrame(current) })
  // Expose for automated checking.
  window.__proof = () => ({ current, loaded })
}
</script>
</body>
</html>
